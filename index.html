<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cine Manual A56 - Mockup</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #000;
  }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
  }

  .phone {
    width: min(390px, 92vw);
    height: min(844px, 94vh);
    background: #0D0D0D;
    border-radius: 40px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 0 0 10px #111, 0 20px 60px rgba(0,0,0,0.6);
  }

  .viewfinder {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(255,109,0,0.08), transparent 60%),
      linear-gradient(160deg, #2b2b2b 0%, #111 55%, #1a1a1a 100%);
  }
  .viewfinder::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size: 33.33% 33.33%;
  }

  .status-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 14px 20px 0;
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: #eee;
    z-index: 5;
  }

  .app-title-badge {
    position: absolute;
    top: 40px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.4);
    font-size: 10px;
    letter-spacing: 3px;
    z-index: 5;
  }

  .rec-timer {
    position: absolute;
    top: 66px;
    left: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(0,0,0,0.5);
    padding: 6px 12px;
    border-radius: 20px;
    z-index: 5;
  }
  .rec-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #E53935;
    animation: blink 1s infinite;
  }
  @keyframes blink { 50% { opacity: 0.2; } }
  .rec-timer span {
    color: #fff;
    font-family: 'Courier New', monospace;
    font-size: 14px;
    letter-spacing: 1px;
  }

  .top-tools {
    position: absolute;
    top: 66px;
    right: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    z-index: 5;
  }
  .tool-icon {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: rgba(0,0,0,0.4);
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    font-size: 15px;
  }

  .manual-fab {
    position: absolute;
    bottom: 110px;
    left: 20px;
    width: 52px; height: 52px;
    border-radius: 50%;
    background: rgba(0,0,0,0.55);
    border: 2px solid #FF6D00;
    display: flex; align-items: center; justify-content: center;
    color: #FFB300;
    font-size: 20px;
    z-index: 20;
    cursor: pointer;
    transition: transform 0.2s, background 0.2s;
  }
  .manual-fab.open {
    background: #FF6D00;
    color: #fff;
    transform: rotate(45deg);
  }

  .quick-chips {
    position: absolute;
    bottom: 110px;
    left: 84px;
    right: 20px;
    display: flex;
    gap: 8px;
    z-index: 15;
    flex-wrap: wrap;
  }
  .chip {
    background: rgba(0,0,0,0.55);
    border: 1px solid rgba(255,255,255,0.15);
    color: #eee;
    font-size: 11px;
    font-family: 'Courier New', monospace;
    padding: 6px 10px;
    border-radius: 14px;
    white-space: nowrap;
  }
  .chip.manual { border-color: #FFB300; color: #FFB300; }

  .controls-panel {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    background: rgba(20,20,20,0.92);
    backdrop-filter: blur(6px);
    border-top: 1px solid #2a2a2a;
    border-radius: 20px 20px 0 0;
    padding: 14px 16px 12px;
    z-index: 25;
    transform: translateY(100%);
    transition: transform 0.28s ease;
  }
  .controls-panel.open {
    transform: translateY(0);
  }

  .panel-handle {
    width: 36px; height: 4px;
    background: #444;
    border-radius: 2px;
    margin: 0 auto 12px;
  }

  .tabs {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-bottom: 12px;
  }
  .tab {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: #888;
    padding-bottom: 6px;
    position: relative;
    cursor: pointer;
  }
  .tab.active { color: #FFB300; }
  .tab.active::after {
    content: "";
    position: absolute;
    bottom: -2px; left: 0; right: 0;
    height: 2px;
    background: #FFB300;
    border-radius: 2px;
  }

  .value-display {
    text-align: center;
    font-family: 'Courier New', monospace;
    font-size: 20px;
    font-weight: bold;
    color: #FFB300;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }

  .slider-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .slider-track {
    flex: 1;
    height: 4px;
    background: #3a3a3a;
    border-radius: 2px;
    position: relative;
  }
  .slider-fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 42%;
    background: linear-gradient(90deg, #FF6D00, #FFB300);
    border-radius: 2px;
  }
  .slider-thumb {
    position: absolute;
    left: 42%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 18px; height: 18px;
    border-radius: 50%;
    background: #fff;
    border: 3px solid #FFB300;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }
  .slider-icon { font-size: 13px; color: #666; width: 14px; text-align: center; }

  .mode-toggle { display: flex; justify-content: center; }
  .toggle-pill {
    display: flex;
    background: #0D0D0D;
    border-radius: 20px;
    padding: 3px;
    border: 1px solid #333;
  }
  .toggle-option {
    padding: 5px 18px;
    font-size: 11px;
    font-weight: 700;
    border-radius: 18px;
    color: #888;
    cursor: pointer;
  }
  .toggle-option.selected { background: #FF6D00; color: #fff; }

  .bottom-bar {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 16px 24px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
    pointer-events: none;
  }
  .bottom-bar > * { pointer-events: auto; }

  .gallery-thumb {
    width: 42px; height: 42px;
    border-radius: 10px;
    background: linear-gradient(135deg, #444, #222);
    border: 2px solid #333;
  }
  .record-btn-wrap {
    width: 72px; height: 72px;
    border-radius: 50%;
    border: 4px solid #FF6D00;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .record-btn {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: #fff;
    transition: all 0.2s;
  }
  .record-btn.recording {
    width: 30px; height: 30px;
    border-radius: 8px;
    background: #E53935;
  }
  .switch-cam {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 19px;
  }
</style>
</head>
<body>

<div class="phone">

  <div class="viewfinder">
    <div class="status-bar">
      <span>9:41</span>
      <span>🔋 100%</span>
    </div>
    <div class="app-title-badge">CINE MANUAL A56</div>

    <div class="rec-timer">
      <div class="rec-dot"></div>
      <span>00:14:07</span>
    </div>

    <div class="top-tools">
      <div class="tool-icon">4K</div>
      <div class="tool-icon">⚡</div>
      <div class="tool-icon">⚙️</div>
    </div>
  </div>

  <div class="quick-chips">
    <div class="chip manual">ISO 640</div>
    <div class="chip">1/120s</div>
    <div class="chip">AF</div>
    <div class="chip">WB AUTO</div>
  </div>

  <div class="manual-fab" id="fabToggle" onclick="togglePanel()">
    <span>+</span>
  </div>

  <div class="controls-panel" id="controlsPanel">
    <div class="panel-handle"></div>
    <div class="tabs">
      <div class="tab active">ISO</div>
      <div class="tab">OBTURADOR</div>
      <div class="tab">FOCO</div>
      <div class="tab">WB</div>
    </div>
    <div class="value-display">ISO 640</div>
    <div class="slider-row">
      <span class="slider-icon">−</span>
      <div class="slider-track">
        <div class="slider-fill"></div>
        <div class="slider-thumb"></div>
      </div>
      <span class="slider-icon">+</span>
    </div>
    <div class="mode-toggle">
      <div class="toggle-pill">
        <div class="toggle-option">AUTO</div>
        <div class="toggle-option selected">MANUAL</div>
      </div>
    </div>
  </div>

  <div class="bottom-bar">
    <div class="gallery-thumb"></div>
    <div class="record-btn-wrap">
      <div class="record-btn recording"></div>
    </div>
    <div class="switch-cam">⟳</div>
  </div>

</div>

<script>
  function togglePanel() {
    document.getElementById('controlsPanel').classList.toggle('open');
    document.getElementById('fabToggle').classList.toggle('open');
  }
</script>

</body>
</html>
