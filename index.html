<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Cine Manual A56</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: #000;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }

  #app {
    position: relative;
    width: 100vw;
    height: 100vh;
    height: calc(var(--vh, 1vh) * 100);
    height: 100dvh;
    background: #000;
    font-family: -apple-system, sans-serif;
  }

  .viewfinder { position: absolute; inset: 0; background:
      radial-gradient(ellipse at 30% 20%, rgba(255,109,0,0.08), transparent 60%),
      linear-gradient(160deg, #2b2b2b 0%, #111 55%, #1a1a1a 100%); overflow: hidden; }
  .viewfinder::after { content: ""; position: absolute; inset: 0;
      background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
      background-size: 33.33% 33.33%; pointer-events: none; }
  #cameraFeed { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
  #cameraMsg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 40px; color: rgba(255,255,255,0.55); font-size: 13px; line-height: 1.6; z-index: 2; }

  .status-bar { position: absolute; top: 0; left: 0; right: 0; padding: 14px 20px 0;
      display: flex; justify-content: space-between; font-size: 13px; color: #eee; z-index: 5; }

  .app-title-badge { position: absolute; top: 40px; left: 50%; transform: translateX(-50%);
      color: rgba(255,255,255,0.4); font-size: 10px; letter-spacing: 3px; z-index: 5; }

  .rec-timer { position: absolute; top: 66px; left: 20px; display: flex; align-items: center; gap: 8px;
      background: rgba(0,0,0,0.5); padding: 6px 12px; border-radius: 20px; z-index: 5; }
  .rec-dot { width: 8px; height: 8px; border-radius: 50%; background: #E53935; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0.2; } }
  .rec-timer span { color: #fff; font-family: 'Courier New', monospace; font-size: 14px; letter-spacing: 1px; }

  .top-tools { position: absolute; top: 66px; right: 20px; display: flex; flex-direction: column; gap: 14px; z-index: 5; }
  .tool-icon { width: 38px; height: 38px; border-radius: 19px; background: rgba(0,0,0,0.45);
      display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px;
      font-weight: 700; cursor: pointer; letter-spacing: 0.3px; }
  .tool-icon.active-state { background: rgba(255,109,0,0.85); color: #fff; }
  .tool-icon:active { transform: scale(0.92); }

  .manual-fab { position: absolute; width: 52px; height: 52px; border-radius: 50%;
      background: rgba(0,0,0,0.55); border: 2px solid #FF6D00;
      display: flex; align-items: center; justify-content: center; color: #FFB300;
      font-size: 11px; font-weight: 800; letter-spacing: 0.3px; z-index: 20; cursor: pointer;
      transition: transform 0.2s, background 0.2s; text-align: center; line-height: 1.1; }
  .manual-fab.open { background: #FF6D00; color: #fff; transform: scale(1.05); }

  .quick-chips { position: absolute; display: flex; gap: 8px; z-index: 15; flex-wrap: wrap; }
  .chip { background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.15); color: #eee;
      font-size: 11px; font-family: 'Courier New', monospace; padding: 6px 10px; border-radius: 14px;
      white-space: nowrap; cursor: pointer; }
  .chip.manual { border-color: #FFB300; color: #FFB300; }
  .chip:active { transform: scale(0.95); }

  .controls-panel { position: absolute; background: rgba(20,20,20,0.95); backdrop-filter: blur(6px);
      z-index: 25; transition: transform 0.28s ease; }
  .panel-close { position: absolute; top: 10px; right: 14px; color: #888; font-size: 20px; cursor: pointer; z-index: 2; }
  .panel-handle { background: #444; border-radius: 2px; }
  .tabs { display: flex; justify-content: center; }
  .tab { font-size: 12px; font-weight: 700; letter-spacing: 0.5px; color: #888; padding: 4px 2px 8px;
      position: relative; cursor: pointer; }
  .tab.active { color: #FFB300; }
  .tab.active::after { content: ""; position: absolute; bottom: -2px; left: 0; right: 0; height: 2px;
      background: #FFB300; border-radius: 2px; }
  .value-display { text-align: center; font-family: 'Courier New', monospace; font-size: 20px;
      font-weight: bold; color: #FFB300; letter-spacing: 1px; }

  .slider-row { display: flex; align-items: center; gap: 10px; }
  .slider-track { flex: 1; background: #3a3a3a; border-radius: 3px; position: relative; cursor: pointer; touch-action: none; }
  .slider-fill { position: absolute; background: linear-gradient(90deg, #FF6D00, #FFB300); border-radius: 3px; pointer-events: none; }
  .slider-thumb { position: absolute; width: 26px; height: 26px; border-radius: 50%; background: #fff;
      border: 3px solid #FFB300; box-shadow: 0 2px 8px rgba(0,0,0,0.5); touch-action: none; cursor: grab; }
  .slider-thumb:active { cursor: grabbing; }
  .slider-icon { font-size: 14px; color: #777; width: 16px; text-align: center; }

  .mode-toggle { display: flex; justify-content: center; }
  .toggle-pill { display: flex; background: #0D0D0D; border-radius: 20px; padding: 3px; border: 1px solid #333; }
  .toggle-option { padding: 5px 18px; font-size: 11px; font-weight: 700; border-radius: 18px; color: #888; cursor: pointer; }
  .toggle-option.selected { background: #FF6D00; color: #fff; }

  .gallery-thumb { border-radius: 10px; background: linear-gradient(135deg, #444, #222); border: 2px solid #333; cursor: pointer; }
  .record-btn-wrap { border-radius: 50%; border: 4px solid #FF6D00; display: flex; align-items: center;
      justify-content: center; cursor: pointer; flex-shrink: 0; }
  .record-btn { border-radius: 50%; background: #fff; transition: all 0.2s; }
  .record-btn.recording { border-radius: 8px; background: #E53935; }
  .switch-cam { border-radius: 50%; background: rgba(255,255,255,0.08); display: flex; align-items: center;
      justify-content: center; color: #fff; font-size: 19px; cursor: pointer; }

  /* ---------- Popover genérico (menus dos ícones e das predefinições) ---------- */
  .popover {
    position: fixed;
    background: rgba(24,24,24,0.98);
    border: 1px solid #333;
    border-radius: 12px;
    padding: 6px;
    z-index: 60;
    display: none;
    min-width: 160px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  .popover.open { display: block; }
  .popover-title { font-size: 10px; color: #777; letter-spacing: 1px; padding: 6px 10px 2px; }
  .popover-item { padding: 10px 12px; font-size: 13px; color: #eee; border-radius: 8px; cursor: pointer;
      display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .popover-item:active { background: rgba(255,109,0,0.25); }
  .popover-item.selected { color: #FFB300; font-weight: 700; }
  .popover-item .desc { font-size: 10px; color: #888; font-weight: 400; }
  .popover-item.selected .desc { color: #cc8a3a; }
  #overlayCatch { position: fixed; inset: 0; z-index: 55; display: none; }
  #overlayCatch.open { display: block; }

  /* ============================================================ RETRATO ============================================================ */
  .rec-controls-bar { position: absolute; left: 0; right: 0; bottom: 0;
      padding: 14px 24px calc(24px + env(safe-area-inset-bottom, 0px));
      display: flex; align-items: center; justify-content: space-between; z-index: 10; }
  .gallery-thumb, .switch-cam { width: 42px; height: 42px; }
  .record-btn-wrap { width: 68px; height: 68px; }
  .record-btn { width: 52px; height: 52px; }
  .record-btn.recording { width: 28px; height: 28px; }

  .manual-fab { bottom: calc(112px + env(safe-area-inset-bottom, 0px)); left: 20px; }
  .quick-chips { bottom: calc(112px + env(safe-area-inset-bottom, 0px)); left: 84px; right: 20px; }

  .controls-panel { left: 0; right: 0; bottom: 0; border-top: 1px solid #2a2a2a; border-radius: 20px 20px 0 0;
      padding: 14px 16px calc(12px + env(safe-area-inset-bottom, 0px)); transform: translateY(100%); }
  .controls-panel.open { transform: translateY(0); }
  .panel-handle { width: 36px; height: 4px; margin: 0 auto 12px; }
  .tabs { gap: 22px; margin-bottom: 12px; }
  .value-display { margin-bottom: 10px; }
  .slider-row { height: 30px; margin-bottom: 10px; }
  .slider-track { height: 6px; width: 100%; }
  .slider-fill { left: 0; top: 0; bottom: 0; }
  .slider-thumb { top: 50%; }

  /* ============================================================ PAISAGEM ============================================================ */
  @media (orientation: landscape) {
    .rec-controls-bar { left: auto; top: 0; bottom: 0; right: env(safe-area-inset-right, 0px);
        width: 92px; padding: 20px 0; flex-direction: column; }
    .manual-fab { bottom: 20px; left: auto; right: calc(112px + env(safe-area-inset-right, 0px)); }
    .quick-chips { bottom: auto; top: 20px; left: 20px; right: calc(112px + env(safe-area-inset-right, 0px));
        flex-direction: column; align-items: flex-start; }
    .top-tools { top: 20px; right: calc(112px + env(safe-area-inset-right, 0px)); flex-direction: row; }
    .rec-timer { top: 20px; left: auto; right: calc(112px + env(safe-area-inset-right, 0px)); }
    .app-title-badge { top: 14px; }
    .status-bar { padding: 10px calc(112px + env(safe-area-inset-right, 0px)) 0 20px; }

    .controls-panel { top: 0; bottom: 0; right: calc(92px + env(safe-area-inset-right, 0px)); left: auto;
        width: 250px; border-left: 1px solid #2a2a2a; border-radius: 20px 0 0 20px; padding: 20px 18px;
        transform: translateX(100%); display: flex; flex-direction: column; justify-content: center; }
    .controls-panel.open { transform: translateX(0); }
    .panel-handle { display: none; }
    .tabs { flex-direction: column; gap: 16px; margin-bottom: 20px; align-items: center; }
    .value-display { margin-bottom: 18px; font-size: 22px; }
    .slider-row { flex-direction: column; width: 30px; height: 180px; margin: 0 auto 18px; }
    .slider-track { width: 6px; height: 100%; }
  }
</style>
</head>
<body>

<div id="app">

  <div class="viewfinder">
    <video id="cameraFeed" autoplay playsinline muted></video>
    <div id="cameraMsg">Toque em "Permitir" quando o navegador<br>pedir acesso à câmera para ver a imagem real aqui.</div>

    <div class="status-bar"><span>9:41</span><span>🔋 100%</span></div>
    <div class="app-title-badge">CINE MANUAL A56</div>

    <div class="rec-timer" id="recTimer" style="display:none;">
      <div class="rec-dot"></div><span id="timerText">00:00:00</span>
    </div>

    <div class="top-tools">
      <div class="tool-icon" id="iconQuality">4K</div>
      <div class="tool-icon" id="iconFlash">⚡</div>
      <div class="tool-icon" id="iconSettings">⚙️</div>
    </div>
  </div>

  <div class="quick-chips" id="quickChips">
    <div class="chip manual" data-control="iso" id="chipIso">ISO 640</div>
    <div class="chip" data-control="shutter" id="chipShutter">1/120s</div>
    <div class="chip" data-control="focus" id="chipFocus">AF</div>
    <div class="chip" data-control="wb" id="chipWb">WB AUTO</div>
    <div class="chip" id="chipFps">30 FPS</div>
  </div>

  <div class="manual-fab" id="fabToggle">PRESET</div>

  <div class="controls-panel" id="controlsPanel">
    <div class="panel-close" id="panelClose">✕</div>
    <div class="panel-handle"></div>
    <div class="tabs" id="tabs">
      <div class="tab active" data-control="iso">ISO</div>
      <div class="tab" data-control="shutter">OBTURADOR</div>
      <div class="tab" data-control="focus">FOCO</div>
      <div class="tab" data-control="wb">WB</div>
    </div>
    <div class="value-display" id="valueDisplay">ISO 640</div>
    <div class="slider-row">
      <span class="slider-icon">−</span>
      <div class="slider-track" id="sliderTrack">
        <div class="slider-fill" id="sliderFill"></div>
        <div class="slider-thumb" id="sliderThumb"></div>
      </div>
      <span class="slider-icon">+</span>
    </div>
    <div class="mode-toggle">
      <div class="toggle-pill" id="togglePill">
        <div class="toggle-option" data-mode="auto">AUTO</div>
        <div class="toggle-option selected" data-mode="manual">MANUAL</div>
      </div>
    </div>
  </div>

  <div class="rec-controls-bar">
    <div class="gallery-thumb"></div>
    <div class="record-btn-wrap" id="recordBtnWrap"><div class="record-btn" id="recordBtn"></div></div>
    <div class="switch-cam">⟳</div>
  </div>

</div>

<div id="overlayCatch"></div>
<div class="popover" id="popover"></div>

<script>
  function setViewportHeight() { document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px'); }
  setViewportHeight();
  window.addEventListener('resize', setViewportHeight);
  window.addEventListener('orientationchange', () => setTimeout(setViewportHeight, 200));

  const video = document.getElementById('cameraFeed');
  const cameraMsg = document.getElementById('cameraMsg');
  async function startCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
      video.srcObject = stream; video.style.display = 'block'; cameraMsg.style.display = 'none';
    } catch (err) {
      cameraMsg.textContent = 'Câmera não disponível neste navegador/contexto (' + err.message + '). O resto da interface funciona normalmente.';
    }
  }
  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) startCamera();
  else cameraMsg.textContent = 'Este navegador não permite acesso à câmera nesta página.';

  const popover = document.getElementById('popover');
  const overlayCatch = document.getElementById('overlayCatch');

  function closePopover() {
    popover.classList.remove('open');
    popover.style.display = 'none';
    overlayCatch.classList.remove('open');
    popover.innerHTML = '';
  }
  overlayCatch.addEventListener('click', closePopover);

  function openPopover(trigger, title, items) {
    popover.innerHTML = '';
    if (title) {
      const t = document.createElement('div');
      t.className = 'popover-title'; t.textContent = title;
      popover.appendChild(t);
    }
    items.forEach(item => {
      const el = document.createElement('div');
      el.className = 'popover-item' + (item.selected ? ' selected' : '');
      el.innerHTML = '<span>' + item.label + (item.selected ? ' ✓' : '') + '</span>' + (item.desc ? '<span class="desc">' + item.desc + '</span>' : '');
      el.addEventListener('click', (e) => { e.stopPropagation(); item.onSelect(); closePopover(); });
      popover.appendChild(el);
    });

    // Precisa ficar visível ANTES de medir a largura/altura para posicionar corretamente
    popover.style.display = 'block';
    popover.style.left = '-9999px';
    popover.style.top = '-9999px';

    const rect = trigger.getBoundingClientRect();
    const pw = popover.offsetWidth || 170;
    const ph = popover.offsetHeight || 100;

    let left = rect.right - pw;
    if (left < 8) left = 8;
    if (left + pw > window.innerWidth - 8) left = window.innerWidth - pw - 8;
    let top = rect.bottom + 8;
    if (top + ph > window.innerHeight - 8) top = rect.top - 8 - ph;
    if (top < 8) top = 8;

    popover.style.left = left + 'px';
    popover.style.top = top + 'px';
    popover.classList.add('open');
    overlayCatch.classList.add('open');
  }

  const iconQuality = document.getElementById('iconQuality');
  let quality = '4K';
  const qualities = [
    { value: '4K',    desc: '3840x2160 · 30fps' },
    { value: '1080P', desc: '1920x1080 · 60fps' },
    { value: '720P',  desc: '1280x720 · 60fps' }
  ];
  iconQuality.addEventListener('click', (e) => {
    e.stopPropagation();
    openPopover(iconQuality, 'QUALIDADE DE VÍDEO', qualities.map(q => ({
      label: q.value, desc: q.desc, selected: q.value === quality,
      onSelect: () => { quality = q.value; iconQuality.textContent = q.value; }
    })));
  });

  const iconFlash = document.getElementById('iconFlash');
  let flashMode = 'off';
  const flashModes = [
    { value: 'off',  label: 'DESLIGADO' },
    { value: 'on',   label: 'LIGADO' },
    { value: 'auto', label: 'AUTOMÁTICO' }
  ];
  iconFlash.addEventListener('click', (e) => {
    e.stopPropagation();
    openPopover(iconFlash, 'LANTERNA', flashModes.map(f => ({
      label: f.label, selected: f.value === flashMode,
      onSelect: () => { flashMode = f.value; iconFlash.classList.toggle('active-state', flashMode !== 'off'); }
    })));
  });

  const iconSettings = document.getElementById('iconSettings');
  let gridOn = false, levelOn = false;
  function renderSettingsPopover() {
    openPopover(iconSettings, 'EXIBIÇÃO', [
      { label: 'Grade', desc: gridOn ? 'LIGADA' : 'DESLIGADA', selected: gridOn,
        onSelect: () => { gridOn = !gridOn; setTimeout(renderSettingsPopover, 0); } },
      { label: 'Nível de horizonte', desc: levelOn ? 'LIGADO' : 'DESLIGADO', selected: levelOn,
        onSelect: () => { levelOn = !levelOn; setTimeout(renderSettingsPopover, 0); } }
    ]);
  }
  iconSettings.addEventListener('click', (e) => { e.stopPropagation(); renderSettingsPopover(); });

  const panel = document.getElementById('controlsPanel');
  const fab = document.getElementById('fabToggle');
  document.getElementById('panelClose').addEventListener('click', () => panel.classList.remove('open'));

  function openPanelOn(controlKey) {
    activeControl = controlKey;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.control === controlKey));
    panel.classList.add('open');
    refreshUI();
  }

  const controls = {
    iso:     { label: 'ISO',       min: 100,  max: 3200, pos: 0.35, chip: 'chipIso',     fmt: v => 'ISO ' + Math.round(v) },
    shutter: { label: 'OBTURADOR', min: 30,   max: 2000, pos: 0.15, chip: 'chipShutter', fmt: v => '1/' + Math.round(v) + 's' },
    focus:   { label: 'FOCO',      min: 0,    max: 100,  pos: 0.9,  chip: 'chipFocus',   fmt: v => v > 95 ? '∞' : (0.2 + (v/100)*5).toFixed(1) + 'm' },
    wb:      { label: 'WB',        min: 2000, max: 9000, pos: 0.45, chip: 'chipWb',      fmt: v => 'WB ' + Math.round(v) + 'K' }
  };
  let activeControl = 'iso';
  let manualMode = { iso: true, shutter: false, focus: false, wb: false };

  const valueDisplay = document.getElementById('valueDisplay');
  const sliderFill = document.getElementById('sliderFill');
  const sliderThumb = document.getElementById('sliderThumb');
  const sliderTrack = document.getElementById('sliderTrack');
  const togglePill = document.getElementById('togglePill');
  const chipFps = document.getElementById('chipFps');

  function isLandscape() { return window.matchMedia('(orientation: landscape)').matches; }
  function realValue(c) { return c.min + c.pos * (c.max - c.min); }

  function refreshUI() {
    const c = controls[activeControl];
    const isManual = manualMode[activeControl];

    valueDisplay.textContent = isManual ? c.fmt(realValue(c)) : 'AUTO';
    valueDisplay.style.color = isManual ? '#FFB300' : '#888';

    const pct = c.pos * 100;
    if (isLandscape()) {
      sliderFill.style.left = '0'; sliderFill.style.right = '0'; sliderFill.style.top = 'auto'; sliderFill.style.bottom = '0';
      sliderFill.style.height = pct + '%'; sliderFill.style.width = '100%';
      sliderThumb.style.left = '50%'; sliderThumb.style.top = (100 - pct) + '%';
    } else {
      sliderFill.style.top = '0'; sliderFill.style.bottom = '0'; sliderFill.style.right = 'auto'; sliderFill.style.left = '0';
      sliderFill.style.width = pct + '%'; sliderFill.style.height = '100%';
      sliderThumb.style.left = pct + '%'; sliderThumb.style.top = '50%';
    }
    sliderThumb.style.transform = 'translate(-50%, -50%)';

    togglePill.querySelectorAll('.toggle-option').forEach(opt => {
      opt.classList.toggle('selected', (opt.dataset.mode === 'manual') === isManual);
    });

    Object.keys(controls).forEach(key => {
      const cc = controls[key];
      const chipEl = document.getElementById(cc.chip);
      const man = manualMode[key];
      chipEl.textContent = man ? cc.fmt(realValue(cc)) : cc.label + ' AUTO';
      chipEl.classList.toggle('manual', man);
    });
  }

  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => { openPanelOn(tab.dataset.control); });
  });

  document.querySelectorAll('.chip[data-control]').forEach(chip => {
    chip.addEventListener('click', () => openPanelOn(chip.dataset.control));
  });

  togglePill.querySelectorAll('.toggle-option').forEach(opt => {
    opt.addEventListener('click', () => { manualMode[activeControl] = (opt.dataset.mode === 'manual'); refreshUI(); });
  });

  let dragging = false;
  function updateFromPointer(clientX, clientY) {
    const rect = sliderTrack.getBoundingClientRect();
    const c = controls[activeControl];
    let fraction = isLandscape() ? 1 - (clientY - rect.top) / rect.height : (clientX - rect.left) / rect.width;
    c.pos = Math.min(1, Math.max(0, fraction));
    manualMode[activeControl] = true;
    refreshUI();
  }
  function onPointerDown(e) { dragging = true; updateFromPointer(e.clientX, e.clientY); }
  function onPointerMove(e) { if (dragging) updateFromPointer(e.clientX, e.clientY); }
  function onPointerUp() { dragging = false; }
  sliderTrack.addEventListener('pointerdown', onPointerDown);
  sliderThumb.addEventListener('pointerdown', onPointerDown);
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup', onPointerUp);

  const presets = {
    CINEMA: { desc: '24fps · obturador 180°', fps: '24 FPS', values: { iso: 0.25, shutter: 0.02, focus: 0.6, wb: 0.4 },
      manual: { iso: true, shutter: true, focus: false, wb: true } },
    'SLOW MOTION': { desc: '120fps · alta velocidade', fps: '120 FPS', values: { iso: 0.5, shutter: 0.12, focus: 0.9, wb: 0.45 },
      manual: { iso: true, shutter: true, focus: false, wb: false } }
  };
  let currentPreset = null;

  fab.addEventListener('click', (e) => {
    e.stopPropagation();
    openPopover(fab, 'PREDEFINIÇÕES', Object.keys(presets).map(name => ({
      label: name, desc: presets[name].desc, selected: currentPreset === name,
      onSelect: () => applyPreset(name)
    })));
  });

  function applyPreset(name) {
    const p = presets[name];
    currentPreset = name;
    Object.keys(p.values).forEach(key => { controls[key].pos = p.values[key]; manualMode[key] = p.manual[key]; });
    chipFps.textContent = p.fps;
    fab.textContent = name === 'CINEMA' ? 'CINEMA' : 'SLOW MO';
    refreshUI();
  }

  let recording = false, seconds = 0, timerInterval = null;
  const recordBtn = document.getElementById('recordBtn');
  const recTimer = document.getElementById('recTimer');
  const timerText = document.getElementById('timerText');
  document.getElementById('recordBtnWrap').addEventListener('click', () => {
    recording = !recording;
    recordBtn.classList.toggle('recording', recording);
    recTimer.style.display = recording ? 'flex' : 'none';
    if (recording) {
      seconds = 0; timerText.textContent = '00:00:00';
      timerInterval = setInterval(() => {
        seconds++;
        const h = String(Math.floor(seconds / 3600)).padStart(2, '0');
        const m = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0');
        const s = String(seconds % 60).padStart(2, '0');
        timerText.textContent = `${h}:${m}:${s}`;
      }, 1000);
    } else clearInterval(timerInterval);
  });

  window.addEventListener('resize', refreshUI);
  refreshUI();
</script>

</body>
</html>
