<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cine Manual</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Visor Total da Câmera */
        .viewfinder {
            position: relative;
            flex: 1;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: filter 0.1s linear; /* Suaviza a troca de ISO/Exposição */
        }

        /* Grade dos Terços */
        .grid-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
        }

        .grid-cell {
            border: 0.5px solid rgba(255, 255, 255, 0.1);
        }

        /* HUD Superior Minimalista */
        .hud-top {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 14px;
            border-radius: 30px;
            backdrop-filter: blur(8px);
            z-index: 10;
        }

        .brand-title {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #ccc;
        }

        .status-recording {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #ff3b30;
            font-weight: 700;
            font-size: 12px;
            font-family: monospace;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .rec-dot {
            width: 7px;
            height: 7px;
            background-color: #ff3b30;
            border-radius: 50%;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.2; }
            100% { opacity: 1; }
        }

        /* Painel Flutuante de Controles (Escondido por padrão) */
        .controls-drawer {
            position: absolute;
            bottom: 85px;
            left: 12px;
            right: 12px;
            background: rgba(10, 10, 10, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 16px;
            border-radius: 16px;
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 20;
            transform: translateY(150%);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
            pointer-events: none;
        }

        .controls-drawer.open {
            transform: translateY(0);
            opacity: 1;
            pointer-events: auto;
        }

        .control-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .control-header {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #aaa;
        }

        .control-value {
            color: #00e5ff;
            font-family: monospace;
            font-size: 12px;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 3px;
            background: #333;
            border-radius: 2px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
        }

        /* Barra Inferior (Dock de Ação) */
        .action-dock {
            position: absolute;
            bottom: 12px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 20px;
            z-index: 30;
        }

        .btn-toggle-controls {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            backdrop-filter: blur(8px);
            cursor: pointer;
        }

        .btn-record {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: transparent;
            border: 3px solid #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            outline: none;
        }

        .btn-record-core {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #ff3b30;
            transition: all 0.2s ease;
        }

        .btn-record.is-recording {
            border-color: #ff3b30;
        }

        .btn-record.is-recording .btn-record-core {
            width: 22px;
            height: 22px;
            border-radius: 4px;
        }

        .dock-spacer {
            width: 80px; /* Equilibra o botão de controles */
        }
    </style>
</head>
<body>

    <!-- Visor de Câmera -->
    <div class="viewfinder">
        <video id="preview" autoplay playsinline muted></video>

        <!-- Grade -->
        <div class="grid-layer">
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        </div>

        <!-- HUD Superior -->
        <div class="hud-top">
            <span class="brand-title">CINE MANUAL</span>
            <div class="status-recording" id="recordingBadge">
                <div class="rec-dot"></div>
                <span id="timerDisplay">00:00</span>
            </div>
            <span style="font-size:10px; color:#888;">RAW HD</span>
        </div>

        <!-- Painel de Controles Manuais Retrátil -->
        <div class="controls-drawer" id="controlsDrawer">
            <!-- ISO -->
            <div class="control-item">
                <div class="control-header">
                    <span>ISO (SENSIBILIDADE)</span>
                    <span class="control-value" id="isoDisplay">100</span>
                </div>
                <input type="range" id="isoSlider" min="100" max="3200" step="100" value="100">
            </div>

            <!-- OBTURADOR -->
            <div class="control-item">
                <div class="control-header">
                    <span>SHUTTER SPEED</span>
                    <span class="control-value" id="shutterDisplay">1/48 s</span>
                </div>
                <input type="range" id="shutterSlider" min="24" max="1000" step="1" value="48">
            </div>

            <!-- FOCO MANUAL -->
            <div class="control-item">
                <div class="control-header">
                    <span>FOCO MANUAL</span>
                    <span class="control-value" id="focusDisplay">50%</span>
                </div>
                <input type="range" id="focusSlider" min="0" max="100" step="1" value="50">
            </div>
        </div>

        <!-- Barra Inferior -->
        <div class="action-dock">
            <button class="btn-toggle-controls" id="toggleControlsBtn">PRO SETTINGS</button>
            
            <button class="btn-record" id="recordButton">
                <div class="btn-record-core"></div>
            </button>

            <div class="dock-spacer"></div>
        </div>
    </div>

    <script>
        const preview = document.getElementById('preview');
        const recordButton = document.getElementById('recordButton');
        const recordingBadge = document.getElementById('recordingBadge');
        const timerDisplay = document.getElementById('timerDisplay');
        const controlsDrawer = document.getElementById('controlsDrawer');
        const toggleControlsBtn = document.getElementById('toggleControlsBtn');

        const isoSlider = document.getElementById('isoSlider');
        const isoDisplay = document.getElementById('isoDisplay');
        const shutterSlider = document.getElementById('shutterSlider');
        const shutterDisplay = document.getElementById('shutterDisplay');
        const focusSlider = document.getElementById('focusSlider');
        const focusDisplay = document.getElementById('focusDisplay');

        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;
        let timerInterval = null;
        let secondsElapsed = 0;

        // Inicia Câmera
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } },
                    audio: true
                });
                preview.srcObject = stream;
                mediaRecorder = new MediaRecorder(stream);

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data && e.data.size > 0) recordedChunks.push(e.data);
                };
                mediaRecorder.onstop = exportVideo;
            } catch (error) {
                alert("Permissão de câmera e áudio necessária.");
            }
        }

        // Alternar Visualização dos Controles
        toggleControlsBtn.addEventListener('click', () => {
            controlsDrawer.classList.toggle('open');
        });

        // Atualização Dinâmica da Imagem (Filtro Visual para simular ISO e Shutter no Navegador)
        function updateCameraFilters() {
            const iso = parseFloat(isoSlider.value);
            const shutter = parseFloat(shutterSlider.value);
            const focus = parseFloat(focusSlider.value);

            // Simulação de ISO (brilho) + Shutter (exposição) + Foco (desfoque)
            const brightness = (iso / 100) * (48 / shutter);
            const blurValue = Math.abs(focus - 50) / 10; // Efeito de desfoque simulado

            preview.style.filter = `brightness(${brightness}) blur(${blurValue}px)`;
        }

        isoSlider.addEventListener('input', (e) => {
            isoDisplay.textContent = e.target.value;
            updateCameraFilters();
        });

        shutterSlider.addEventListener('input', (e) => {
            shutterDisplay.textContent = `1/${e.target.value} s`;
            updateCameraFilters();
        });

        focusSlider.addEventListener('input', (e) => {
            focusDisplay.textContent = `${e.target.value}%`;
            updateCameraFilters();
        });

        // Cronômetro e Gravação
        function startTimer() {
            secondsElapsed = 0;
            timerDisplay.textContent = "00:00";
            timerInterval = setInterval(() => {
                secondsElapsed++;
                const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
                const secs = String(secondsElapsed % 60).padStart(2, '0');
                timerDisplay.textContent = `${mins}:${secs}`;
            }, 1000);
        }

        recordButton.addEventListener('click', () => {
            if (!mediaRecorder) return;

            if (!isRecording) {
                recordedChunks = [];
                mediaRecorder.start();
                isRecording = true;
                recordButton.classList.add('is-recording');
                recordingBadge.style.opacity = '1';
                startTimer();
            } else {
                mediaRecorder.stop();
                isRecording = false;
                recordButton.classList.remove('is-recording');
                recordingBadge.style.opacity = '0';
                clearInterval(timerInterval);
            }
        });

        function exportVideo() {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `cinemanual_take_${Date.now()}.webm`;
            a.click();
        }

        startCamera();
    </script>
</body>
</html>
